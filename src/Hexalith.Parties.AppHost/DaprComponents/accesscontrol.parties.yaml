# DAPR Access Control Configuration for the Parties actor-host sidecar.
# Story 12.2 reference: AC2 + AC3.
#
# Service-invocation policy:
#   defaultAction: deny — only EventStore may invoke Parties via service invocation,
#   and only on the exact command/query/projection/discovery operations below. This retains
#   the Story 12.0 `party -> parties/process` mapping and admits the Story 8.6 SDK
#   consumer routes without exposing actor methods, /healthz, /metrics, or any
#   wildcard path to peer DAPR callers.
#
# Pub/sub event delivery (NOT covered by this list):
#   The Tenants -> Parties event flow is delivered by the shared pubsub component:
#   the Tenants app publishes tenant lifecycle events; the Parties sidecar invokes
#   `app.MapTenantEventSubscription()` (POST /tenants/events) after delivery. Pub/sub
#   delivery bypasses service-invocation access control and is enforced instead by
#   the pubsub component scope (defined in pubsub.yaml; subscriber routes in
#   subscription-parties.yaml). New publishers/subscribers must be added there, not
#   in this access-control list.
apiVersion: dapr.io/v1alpha1
kind: Configuration
metadata:
  name: accesscontrol-parties
spec:
  accessControl:
    defaultAction: deny
    trustDomain: "public"
    policies:
      - appId: eventstore
        defaultAction: deny
        trustDomain: "public"
        namespace: "default"
        operations:
          - name: /process
            httpVerb: ['POST']
            action: allow
          - name: /query
            httpVerb: ['POST']
            action: allow
          - name: /admin/operational-index-metadata
            httpVerb: ['POST']
            action: allow
          - name: /project
            httpVerb: ['POST']
            action: allow
          - name: /project/v2
            httpVerb: ['POST']
            action: allow
          - name: /replay-state
            httpVerb: ['POST']
            action: allow
          - name: /project/rebuild/v1
            httpVerb: ['POST']
            action: allow
          - name: /project/rebuild/shared/v1
            httpVerb: ['POST']
            action: allow
          - name: /project/rebuild/stage/v1
            httpVerb: ['POST']
            action: allow
          - name: /project/rebuild/commit/v1
            httpVerb: ['POST']
            action: allow
          - name: /project/rebuild/abort/v1
            httpVerb: ['POST']
            action: allow
          - name: /project/rebuild/verify/v1
            httpVerb: ['POST']
            action: allow
