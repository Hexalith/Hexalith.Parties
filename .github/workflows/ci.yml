name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 2 * * *'
  repository_dispatch:
    types: [contract_requiring_verification_published]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ci:
    uses: Hexalith/Hexalith.Builds/.github/workflows/domain-ci-v2.yml@3c2f5944aaa28dc7854a00a8a9df171aa810b0c7
    with:
      solution: Hexalith.Parties.Standalone.slnx
      additional-sdk-version: '10.0.404'
      module-manifest: module/hexalith.module-manifest.v2.json
      integration-test-profiles: platform-package
      package-prepare-script: scripts/prepare-ci-package-dependencies.sh
      test-platform: microsoft-testing-platform
      run-consumer-validation: true
      run-coverage-gate: false
      unit-test-projects: |
        tests/Hexalith.Parties.Aspire.Tests
        tests/Hexalith.Parties.Contracts.Tests
        tests/Hexalith.Parties.Authentication.Tests
        tests/Hexalith.Parties.Client.Tests
        tests/Hexalith.Parties.Server.Tests
        tests/Hexalith.Parties.Projections.Tests
        tests/Hexalith.Parties.Security.Tests
        tests/Hexalith.Parties.AdminPortal.Tests
        tests/Hexalith.Parties.ConsumerPortal.Tests
        tests/Hexalith.Parties.UI.Tests
        tests/Hexalith.Parties.Picker.Tests
        tests/Hexalith.Parties.Mcp.Tests
        tests/Hexalith.Parties.Tests
        tests/Hexalith.Parties.Sample.Tests
        tests/Hexalith.Parties.Ci.Tests
      build-timeout-minutes: 120
    secrets:
      registry-pull-username: ${{ secrets.HEXALITH_CI_REGISTRY_USERNAME }}
      registry-pull-password: ${{ secrets.HEXALITH_CI_REGISTRY_PASSWORD }}

  verify-public-package-integration:
    needs: ci
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require the owning integration job to pass
        env:
          CI_RESULT: ${{ needs.ci.result }}
        run: test "$CI_RESULT" = success
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: false
      - name: Test public and private evidence refusal controls
        run: python3 -m unittest discover -s scripts -p 'test_*_integration.py'
      - name: Download this workflow's required integration evidence
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: module-integration-diagnostics
          path: TestResults/public-package-evidence
      - name: Require real public-package native effects and complete cleanup
        shell: bash
        run: |
          platform_sha=$(git rev-parse HEAD:references/Hexalith.Platform)
          builds_sha=$(git rev-parse HEAD:references/Hexalith.Builds)
          python3 scripts/verify-public-package-integration.py TestResults/public-package-evidence \
            --source "$GITHUB_SHA" --platform "$platform_sha" --builds "$builds_sha"

  eventstore-404-package-cohort:
    name: EventStore 4.0.4 package cohort (offline)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: false
          fetch-depth: 1
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
          dotnet-version: '10.0.404'
      - name: Initialize recorded catalog and gateway settings
        run: |
          git -c submodule.recurse=false submodule update --init --depth 1 --checkout -- references/Hexalith.Builds references/Hexalith.EventStore
          git submodule status -- references/Hexalith.Builds references/Hexalith.EventStore
      - name: Build public packages and run focused catalog qualification
        shell: bash
        run: |
          package_properties=(
            -p:HexalithEventStoreVersion=4.0.4
            -p:HexalithTenantsVersion=5.11.2
            -p:HexalithMemoriesVersion=3.0.11
            -p:UseHexalithProjectReferences=false
            -p:UseNuGetDeps=true
            -p:EventStoreFromSource=false
            -p:HexalithEventStoreFromSource=false
            -p:HexalithTenantsFromSource=false
            -p:HexalithMemoriesFromSource=false
            -p:HexalithCommonsFromSource=false
            -p:HexalithCommonsHttpFromSource=false
            -p:HexalithMcpCliFromSource=false
            -p:RestoreSources=https://api.nuget.org/v3/index.json
          )
          # Compile the actual owners; this job never starts a private runtime or topology.
          for project in \
            src/Hexalith.Parties.Contracts/Hexalith.Parties.Contracts.csproj \
            src/Hexalith.Parties.EventStoreExtensions/Hexalith.Parties.EventStoreExtensions.csproj \
            src/Hexalith.Parties/Hexalith.Parties.csproj \
            tests/Hexalith.Parties.Catalog.Tests/Hexalith.Parties.Catalog.Tests.csproj \
            tests/Hexalith.Parties.Ci.Tests/Hexalith.Parties.Ci.Tests.csproj \
            tests/Hexalith.Parties.Tests/Hexalith.Parties.Tests.csproj; do
            dotnet build "$project" --configuration Release --disable-build-servers -m:1 -warnaserror "${package_properties[@]}"
          done
          dotnet test --project tests/Hexalith.Parties.Catalog.Tests/Hexalith.Parties.Catalog.Tests.csproj \
            --no-build --no-restore --configuration Release "${package_properties[@]}" \
            --filter-class Hexalith.Parties.Contracts.Tests.PartiesCatalogTests \
            --filter-class Hexalith.Parties.Contracts.Tests.PartiesCatalogAdapterTests \
            --minimum-expected-tests 3 --fail-skips on
          dotnet test --project tests/Hexalith.Parties.Ci.Tests/Hexalith.Parties.Ci.Tests.csproj \
            --no-build --no-restore --configuration Release "${package_properties[@]}" \
            --filter-method Hexalith.Parties.Ci.Tests.AspireRuntimePreparationTests.CatalogApiAvailabilityDoesNotSelectNativeHosts \
            --minimum-expected-tests 25 --fail-skips on
          dotnet test --project tests/Hexalith.Parties.Tests/Hexalith.Parties.Tests.csproj \
            --no-build --no-restore --configuration Release "${package_properties[@]}" \
            --filter-class Hexalith.Parties.Tests.Gateway.PartyIdentityQueryHandlerTests \
            --minimum-expected-tests 322 --fail-skips on

  eventstore-420-package-cohort:
    name: EventStore 4.2.0 package cohort (offline)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: false
          fetch-depth: 1
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
          dotnet-version: '10.0.404'
      - name: Initialize recorded catalog and gateway settings
        run: |
          git -c submodule.recurse=false submodule update --init --depth 1 --checkout -- references/Hexalith.Builds references/Hexalith.Platform references/Hexalith.EventStore references/Hexalith.Tenants references/Hexalith.Memories
          git submodule status -- references/Hexalith.Builds references/Hexalith.EventStore
      - name: Build public packages and run focused catalog qualification
        shell: bash
        run: |
          package_properties=(
            -p:HexalithEventStoreVersion=4.2.0
            -p:HexalithTenantsVersion=7.0.5
            -p:HexalithMemoriesVersion=3.0.25
            -p:UseHexalithProjectReferences=false
            -p:UseNuGetDeps=true
            -p:EventStoreFromSource=false
            -p:HexalithEventStoreFromSource=false
            -p:HexalithTenantsFromSource=false
            -p:HexalithMemoriesFromSource=false
            -p:HexalithCommonsFromSource=false
            -p:HexalithCommonsHttpFromSource=false
            -p:HexalithMcpCliFromSource=false
            -p:RestoreSources=https://api.nuget.org/v3/index.json
          )
          # Compile the actual owners; this job never starts a private runtime or topology.
          for project in \
            src/Hexalith.Parties.Contracts/Hexalith.Parties.Contracts.csproj \
            src/Hexalith.Parties.EventStoreExtensions/Hexalith.Parties.EventStoreExtensions.csproj \
            src/Hexalith.Parties/Hexalith.Parties.csproj \
            tests/Hexalith.Parties.Catalog.Tests/Hexalith.Parties.Catalog.Tests.csproj \
            tests/Hexalith.Parties.Ci.Tests/Hexalith.Parties.Ci.Tests.csproj \
            tests/Hexalith.Parties.Tests/Hexalith.Parties.Tests.csproj \
            tests/Hexalith.Parties.IntegrationTests/Hexalith.Parties.IntegrationTests.csproj; do
            dotnet build "$project" --configuration Release --disable-build-servers -m:1 -warnaserror "${package_properties[@]}"
          done
          dotnet test --project tests/Hexalith.Parties.Catalog.Tests/Hexalith.Parties.Catalog.Tests.csproj \
            --no-build --no-restore --configuration Release "${package_properties[@]}" \
            --filter-class Hexalith.Parties.Contracts.Tests.PartiesCatalogTests \
            --filter-class Hexalith.Parties.Contracts.Tests.PartiesCatalogAdapterTests \
            --minimum-expected-tests 20 --fail-skips on
          dotnet test --project tests/Hexalith.Parties.Ci.Tests/Hexalith.Parties.Ci.Tests.csproj \
            --no-build --no-restore --configuration Release "${package_properties[@]}" \
            --filter-method Hexalith.Parties.Ci.Tests.AspireRuntimePreparationTests.CatalogApiAvailabilityDoesNotSelectNativeHosts \
            --filter-method Hexalith.Parties.Ci.Tests.AspireRuntimePreparationTests.EventStoreTransportAndSelectorCapabilitiesRequireExactQualification \
            --minimum-expected-tests 41 --fail-skips on
          dotnet test --project tests/Hexalith.Parties.IntegrationTests/Hexalith.Parties.IntegrationTests.csproj \
            --no-build --no-restore --configuration Release "${package_properties[@]}" \
            --filter-class Hexalith.Parties.IntegrationTests.Topology.DevelopmentCatalogConfigurationTests \
            --filter-class Hexalith.Parties.IntegrationTests.Topology.DevelopmentCatalogPreparationCleanupTests \
            --filter-class Hexalith.Parties.IntegrationTests.Topology.DevelopmentCatalogModelFinalizationTests \
            --minimum-expected-tests 51 --fail-skips on
          dotnet test --project tests/Hexalith.Parties.Tests/Hexalith.Parties.Tests.csproj \
            --no-build --no-restore --configuration Release "${package_properties[@]}" \
            --filter-class Hexalith.Parties.Tests.Gateway.PartiesCatalogGatewaySelectorTests \
            --minimum-expected-tests 24 --fail-skips on

  published-catalog-runtime:
    name: Published catalog concurrent runtime
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: false
          fetch-depth: 0
          persist-credentials: false
      - name: Initialize recorded root dependencies
        uses: Hexalith/Hexalith.Builds/Github/initialize-build@3c2f5944aaa28dc7854a00a8a9df171aa810b0c7
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
          dotnet-version: '10.0.404'
      - name: Read the selected Dapr toolchain
        id: toolchain
        shell: bash
        run: |
          python3 - <<'PYTHON'
          import os
          import re
          import xml.etree.ElementTree as ET
          root = ET.parse('references/Hexalith.Builds/Props/Directory.Packages.props').getroot()
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              for name, property in [('cli', 'HexalithDaprCliVersion'), ('runtime', 'HexalithDaprRuntimeVersion')]:
                  value = root.find('.//' + property).text
                  if re.fullmatch(r'[0-9]+\.[0-9]+\.[0-9]+', value) is None:
                      raise ValueError('Expected an exact selected Dapr version')
                  output.write(name + '=' + value + '\n')
          PYTHON
      - name: Prepare Dapr with the shared owner action
        uses: Hexalith/Hexalith.Builds/Github/dapr-init@3c2f5944aaa28dc7854a00a8a9df171aa810b0c7
        with:
          version: ${{ steps.toolchain.outputs.cli }}
          runtime-version: ${{ steps.toolchain.outputs.runtime }}
      - name: Trust the runner HTTPS development certificate
        run: bash scripts/prepare-aspire-https-trust.sh
      - name: Build the test entry point before freezing runtime artifacts
        run: dotnet build tests/Hexalith.Parties.IntegrationTests/Hexalith.Parties.IntegrationTests.csproj --configuration Release --disable-build-servers -m:1 -warnaserror -p:HexalithUsePublishedSdkForHostedTests=true -p:CopyLocalLockFileAssemblies=true
      - name: Prepare the exact public runtime cohort
        run: bash scripts/prepare-aspire-runtime-hosts.sh --configuration Release
      - name: Require concurrent catalogs, authenticated effects and complete cleanup
        env:
          PARTIES_MTLS_TOPOLOGY_TESTS: 'true'
          DAPR_MTLS_RUNTIME_PROFILE: ${{ steps.toolchain.outputs.runtime }}
        run: |
          dotnet test --project tests/Hexalith.Parties.IntegrationTests/Hexalith.Parties.IntegrationTests.csproj \
            --configuration Release --no-build --no-restore \
            --filter-method Hexalith.Parties.IntegrationTests.Topology.PartiesTopologyIsolationTests.ConcurrentSessions_IsolateStreamsRejectCrossCallsAndSurvivePeerDisposalAsync \
            --minimum-expected-tests 1 --fail-skips on \
            --report-xunit-trx --results-directory TestResults/catalog-runtime
      - name: Retain the actual runtime result
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: published-catalog-runtime-results
          path: TestResults/catalog-runtime
          if-no-files-found: error

  memories-3018-package-protocol:
    name: Memories 3.0.18 package protocol
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: false
          fetch-depth: 1
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
          dotnet-version: '10.0.404'
      - name: Initialize recorded package inputs
        run: |
          git -c submodule.recurse=false submodule update --init --depth 1 --checkout -- references/Hexalith.Builds references/Hexalith.EventStore
          git submodule status -- references/Hexalith.Builds references/Hexalith.EventStore
      - name: Qualify Memories 3.0.18 refresh and durable recovery
        shell: bash
        env:
          NUGET_PACKAGES: ${{ runner.temp }}/hexalith-memories-3018-nuget
          NUGET_HTTP_CACHE_PATH: ${{ runner.temp }}/hexalith-memories-3018-http
        run: |
          set -euo pipefail
          package_properties=(
            -p:HexalithEventStoreVersion=4.0.4
            -p:HexalithTenantsVersion=7.0.0
            -p:HexalithMemoriesVersion=3.0.18
            -p:UseHexalithProjectReferences=false
            -p:UseNuGetDeps=true
            -p:EventStoreFromSource=false
            -p:HexalithEventStoreFromSource=false
            -p:HexalithTenantsFromSource=false
            -p:HexalithMemoriesFromSource=false
            -p:HexalithCommonsFromSource=false
            -p:HexalithCommonsHttpFromSource=false
            -p:HexalithMcpCliFromSource=false
            -p:RestoreSources=https://api.nuget.org/v3/index.json
          )
          # Use the published client with controlled HTTP replies; no private runtime is started.
          dotnet build tests/Hexalith.Parties.Tests/Hexalith.Parties.Tests.csproj \
            --configuration Release --disable-build-servers -m:1 -warnaserror "${package_properties[@]}"
          dotnet test --project tests/Hexalith.Parties.Tests/Hexalith.Parties.Tests.csproj \
            --no-build --no-restore --configuration Release "${package_properties[@]}" \
            --filter-class Hexalith.Parties.Tests.Search.PartyMemoryRestClientRecoveryTests \
            --filter-class Hexalith.Parties.Tests.Search.PartyMemoryRecoveryTests \
            --minimum-expected-tests 52 --fail-skips on

  owner-publish:
    name: Owner publisher qualification
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
          dotnet-version: '10.0.404'
      - name: Initialize owner publisher build dependencies
        run: git -c submodule.recurse=false submodule update --init references/Hexalith.EventStore references/Hexalith.Builds
      - name: Install Dapr CLI for manifest publisher
        uses: dapr/setup-dapr@8d980918fd43a2765c143ce7f687665b2d46a6b9 # v2
        with:
          version: '1.18.0'
      - name: Qualify actual owner manifests and rejection controls
        run: python3 -B -m unittest scripts.test_verify_eventstore_publish -v

  ui-a11y:
    name: UI accessibility
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CI: 'true'
      BASE_URL: http://127.0.0.1:5072
      PLAYWRIGHT_SKIP_WEBSERVER: ''
    defaults:
      run:
        working-directory: tests/e2e
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: false
      - name: Initialize UI build dependencies
        working-directory: .
        run: git -c submodule.recurse=false submodule update --init references/Hexalith.Builds references/Hexalith.Commons
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
          dotnet-version: '10.0.404'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.22.1'
          cache: npm
          cache-dependency-path: tests/e2e/package-lock.json
      - name: Install locked browser-test dependencies
        run: npm ci
      - name: Test browser server configuration
        run: npm run test:config
      - name: Typecheck browser tests
        run: npm run typecheck
      - name: Test restored UI asset resolution
        run: python3 ../Hexalith.Parties.UI.Tests/verify-restored-assets.py
      - name: Install Chromium and system dependencies
        run: npm run install:browsers
      - name: Build UI with published dependencies
        run: dotnet build ../../src/Hexalith.Parties.UI/Hexalith.Parties.UI.csproj --configuration Release -p:UseHexalithProjectReferences=false -p:UseNuGetDeps=true
      - name: Run UI browser gate
        run: npm run test:ui
      - name: Upload UI browser evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ui-a11y-results
          path: |
            tests/e2e/playwright-report
            tests/e2e/test-results
          retention-days: 14
          if-no-files-found: warn

  bmad-config:
    name: BMAD configuration tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: false
      - name: Test configuration merging and resolvers
        run: python3 -B -m unittest discover -s _bmad/scripts/tests -v

  lifecycle-controller-tests:
    name: Lifecycle controller tests
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: false
      - name: Initialize direct controller dependencies
        run: git -c submodule.recurse=false submodule update --init --depth 1 --checkout -- references/Hexalith.Builds
      - name: Test lifecycle ownership, cancellation and cleanup
        run: python3 -B -m unittest discover -s tests/ci-lifecycle -v

  platform-declaration:
    name: Parties Platform declaration
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
          dotnet-version: '10.0.404'
      - name: Initialize direct declaration owners
        run: git -c submodule.recurse=false submodule update --init --depth 1 --checkout -- references/Hexalith.EventStore references/Hexalith.Tenants references/Hexalith.Memories
      - name: Restore the pinned module tool
        run: dotnet tool restore
      - name: Validate Parties with its reference declarations
        run: >-
          dotnet tool run hexalith-module -- validate
          --manifest module/hexalith.module-manifest.v2.json
          --manifest references/Hexalith.EventStore/module/hexalith.module-manifest.v2.json
          --manifest references/Hexalith.Tenants/module/hexalith.module-manifest.v2.json
          --manifest references/Hexalith.Memories/module/hexalith.module-manifest.v2.json
      - name: Check the owner ACL declaration
        run: python3 scripts/render-platform-declaration.py --check
      - name: Test strict declaration rendering
        run: python3 -B -m unittest discover -s scripts -p test_platform_declaration.py -v
