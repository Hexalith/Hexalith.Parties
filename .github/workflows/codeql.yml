name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '27 3 * * 1'

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  codeql:
    uses: Hexalith/Hexalith.Builds/.github/workflows/codeql.yml@3c2f5944aaa28dc7854a00a8a9df171aa810b0c7
    permissions:
      security-events: write
      contents: read
    with:
      languages: csharp
