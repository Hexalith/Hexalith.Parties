name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '27 3 * * 1'

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  codeql:
    uses: Hexalith/Hexalith.Builds/.github/workflows/codeql.yml@9f5d751f7ab0b7a621dcd18b589bf061fabac6ec
    permissions:
      security-events: write
      contents: read
    with:
      languages: csharp
