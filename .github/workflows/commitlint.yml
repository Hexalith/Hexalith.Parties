name: Commitlint

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, edited]
  push:
    branches: [main]

concurrency:
  group: commitlint-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  commitlint:
    uses: Hexalith/Hexalith.Builds/.github/workflows/commitlint.yml@9f5d751f7ab0b7a621dcd18b589bf061fabac6ec
    with:
      node-version: '24.22.1'
      pull-request-title: ${{ github.event.pull_request.title || '' }}
