name: Disposable CI lifecycle qualification

on:
  workflow_dispatch:
    inputs:
      scenario:
        description: Explicit real-service scenario; cancellation is performed by the operator
        required: true
        type: choice
        options: [matrix, focused-ci, passing, failing, retry-with-peer, partial-startup, collision, startup-timeout, owner-cancellation, attached-failure, hold-expiry, invalid-handoff, cancel-startup, cancel-execution, failure-then-cancellation]

permissions:
  contents: read

# Every dispatch is a separate observation. Never cancel another qualification owner implicitly.
concurrency:
  group: lifecycle-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  baseline:
    uses: Hexalith/Hexalith.Builds/.github/workflows/domain-ci-v2.yml@9f85c64beae32befe050240526af398063e81eba
    with:
      solution: Hexalith.Parties.Standalone.slnx
      additional-sdk-version: '10.0.404'
      module-manifest: module/hexalith.module-manifest.v2.json
      integration-test-profiles: platform-package
      package-prepare-script: scripts/prepare-ci-package-dependencies.sh
      test-platform: microsoft-testing-platform
      run-consumer-validation: true
      run-coverage-gate: false
      unit-test-projects: |
        tests/Hexalith.Parties.Aspire.Tests
        tests/Hexalith.Parties.Contracts.Tests
        tests/Hexalith.Parties.Authentication.Tests
        tests/Hexalith.Parties.Client.Tests
        tests/Hexalith.Parties.Server.Tests
        tests/Hexalith.Parties.Projections.Tests
        tests/Hexalith.Parties.Security.Tests
        tests/Hexalith.Parties.AdminPortal.Tests
        tests/Hexalith.Parties.ConsumerPortal.Tests
        tests/Hexalith.Parties.UI.Tests
        tests/Hexalith.Parties.Picker.Tests
        tests/Hexalith.Parties.Mcp.Tests
        tests/Hexalith.Parties.Tests
        tests/Hexalith.Parties.Sample.Tests
        tests/Hexalith.Parties.Ci.Tests
      build-timeout-minutes: 60
    secrets:
      registry-pull-username: ${{ secrets.HEXALITH_CI_REGISTRY_USERNAME }}
      registry-pull-password: ${{ secrets.HEXALITH_CI_REGISTRY_PASSWORD }}

  qualification:
    needs: baseline
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: false
      - name: Initialize only direct owner dependencies
        run: git -c submodule.recurse=false submodule update --init --depth 1
      - name: Test the lifecycle controller before any service
        run: python3 -B -m unittest discover -s tests/ci-lifecycle -v
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
          dotnet-version: '10.0.404'
      - name: Prepare the actual pinned package tool and catalog
        run: python3 -B references/Hexalith.Builds/Github/prepare-module-build/prepare_module_build.py --manifest module/hexalith.module-manifest.v2.json
      - name: Build the explicit declared lifecycle suites
        run: |
          dotnet build tests/Hexalith.Parties.Platform.LifecycleTests/Hexalith.Parties.Platform.LifecycleTests.csproj --configuration Release -p:UseHexalithProjectReferences=false -p:UseNuGetDeps=true
      - name: Build the explicit attached lifecycle suite when selected
        if: ${{ contains(fromJSON('["matrix","owner-cancellation","attached-failure","hold-expiry","cancel-execution"]'), inputs.scenario) }}
        run: dotnet build tests/Hexalith.Parties.Platform.AttachedLifecycleTests/Hexalith.Parties.Platform.AttachedLifecycleTests.csproj --configuration Release -p:UseHexalithProjectReferences=false -p:UseNuGetDeps=true
      - name: Read verified catalog toolchain versions
        run: |
          python3 - <<'PY'
          import json
          import os
          import re
          from pathlib import Path
          from xml.etree import ElementTree as ET
          builds = Path('references/Hexalith.Builds')
          root = ET.parse(builds / 'Props/Directory.Packages.props').getroot()
          versions = {}
          for name, property_name in [('CI_ASPIRE_VERSION', 'HexalithAspireAppHostSdkVersion'), ('CI_DAPR_CLI_VERSION', 'HexalithDaprCliVersion'), ('CI_DAPR_RUNTIME_VERSION', 'HexalithDaprRuntimeVersion')]:
              node = root.find('.//' + property_name)
              if node is None or node.text is None:
                  raise ValueError('Missing verified catalog toolchain property: ' + property_name)
              value = node.text.strip()
              if not value or any(character not in '0123456789.-abcdefghijklmnopqrstuvwxyz' for character in value):
                  raise ValueError('Invalid verified catalog toolchain version')
              versions[name] = value
          # Builds pins each Dapr archive digest beside the catalog versions; without them nothing is downloaded.
          digests_path = builds / 'Props/dapr-toolchain-sha256.json'
          if not digests_path.is_file():
              raise ValueError('The pinned Builds catalog carries no Dapr archive digests; adopt a Builds release that pins them')
          digests = json.loads(digests_path.read_text(encoding='utf-8'))
          if digests.get('schema') != 'hexalith.builds.dapr-toolchain-sha256.v1':
              raise ValueError('Unsupported Dapr archive digest schema')
          runtime = digests.get('runtime', {}).get(versions['CI_DAPR_RUNTIME_VERSION'], {})
          pinned = {
              'CI_DAPR_CLI_SHA256': digests.get('cli', {}).get(versions['CI_DAPR_CLI_VERSION'], {}).get('dapr_linux_amd64.tar.gz'),
              'CI_DAPRD_SHA256': runtime.get('daprd_linux_amd64.tar.gz'),
              'CI_PLACEMENT_SHA256': runtime.get('placement_linux_amd64.tar.gz'),
              'CI_SCHEDULER_SHA256': runtime.get('scheduler_linux_amd64.tar.gz'),
          }
          for name, value in pinned.items():
              if not isinstance(value, str) or re.fullmatch(r'[0-9a-f]{64}', value) is None:
                  raise ValueError('Missing or invalid pinned Dapr archive digest: ' + name)
          with Path(os.environ['GITHUB_ENV']).open('a') as output:
              for name, value in {**versions, **pinned}.items():
                  output.write(name + '=' + value + '\n')
          PY
      - name: Restore verified Aspire runtime packages in this job
        run: |
          set -euo pipefail
          scratch="$(mktemp -d "${RUNNER_TEMP:-${TMPDIR:-/tmp}}/parties-lifecycle-aspire.XXXXXX")"
          trap 'rm -rf -- "$scratch"' EXIT
          cat > "$scratch/apphost.cs" <<APPHOST
          #!/usr/bin/env dotnet
          #:sdk Aspire.AppHost.Sdk@$CI_ASPIRE_VERSION
          using Aspire.Hosting;
          var builder = DistributedApplication.CreateBuilder(args);
          using var app = builder.Build();
          APPHOST
          dotnet restore "$scratch/apphost.cs" --verbosity minimal
          packages="${NUGET_PACKAGES:-$HOME/.nuget/packages}"
          python3 -B scripts/qualify-disposable-ci.py verify-runtime-cache --packages "$packages" --aspire-version "$CI_ASPIRE_VERSION"
      - name: Install toolchain without provisioning services
        run: |
          set -euo pipefail
          tools="$RUNNER_TEMP/hexalith-lifecycle-tools"
          dapr_home="$RUNNER_TEMP/hexalith-lifecycle-dapr"
          mkdir -p "$tools" "$dapr_home/tools" "$dapr_home/.dapr/bin"
          dotnet tool install --tool-path "$tools" Aspire.Cli --version "$CI_ASPIRE_VERSION"
          verify_archive() {
            if [[ ! "$1" =~ ^[0-9a-f]{64}$ ]]; then
              echo "Refusing $2 without its pinned SHA-256 digest." >&2
              return 1
            fi
            printf '%s  %s\n' "$1" "$2" | sha256sum --check --strict --quiet -
          }
          curl --fail --location --proto '=https' --proto-redir '=https' "https://github.com/dapr/cli/releases/download/v$CI_DAPR_CLI_VERSION/dapr_linux_amd64.tar.gz" -o "$RUNNER_TEMP/lifecycle-dapr-cli.tar.gz"
          verify_archive "${CI_DAPR_CLI_SHA256:-}" "$RUNNER_TEMP/lifecycle-dapr-cli.tar.gz"
          tar -xzf "$RUNNER_TEMP/lifecycle-dapr-cli.tar.gz" -C "$dapr_home/tools" dapr
          for binary in daprd placement scheduler; do
            case "$binary" in
              daprd) digest="${CI_DAPRD_SHA256:-}" ;;
              placement) digest="${CI_PLACEMENT_SHA256:-}" ;;
              scheduler) digest="${CI_SCHEDULER_SHA256:-}" ;;
            esac
            curl --fail --location --proto '=https' --proto-redir '=https' "https://github.com/dapr/dapr/releases/download/v$CI_DAPR_RUNTIME_VERSION/${binary}_linux_amd64.tar.gz" -o "$RUNNER_TEMP/lifecycle-$binary.tar.gz"
            verify_archive "$digest" "$RUNNER_TEMP/lifecycle-$binary.tar.gz"
            tar -xzf "$RUNNER_TEMP/lifecycle-$binary.tar.gz" -C "$dapr_home/.dapr/bin" "$binary"
          done
          echo "$tools" >> "$GITHUB_PATH"
          echo "HEXALITH_DAPR_HOME=$dapr_home" >> "$GITHUB_ENV"
      # The reader file lives at a fixed path under runner.temp, so any later step in this job could read it.
      # Only the owner-starting steps receive it as DOCKER_CONFIG, nothing exports it through GITHUB_ENV, and an
      # always() step removes it.
      - name: Configure only the dedicated pull reader
        env:
          REGISTRY_READER_USERNAME: ${{ secrets.HEXALITH_CI_REGISTRY_USERNAME }}
          REGISTRY_READER_PASSWORD: ${{ secrets.HEXALITH_CI_REGISTRY_PASSWORD }}
          HEXALITH_LIFECYCLE_REGISTRY_CONFIG: ${{ runner.temp }}/hexalith-lifecycle-registry.reader
        run: |
          python3 - <<'PY'
          import base64
          import json
          import os
          from pathlib import Path
          username, password = (os.environ[key] for key in ['REGISTRY_READER_USERNAME', 'REGISTRY_READER_PASSWORD'])
          if not username or not password:
              raise ValueError('Dedicated pull-only reader is required')
          directory = Path(os.environ['HEXALITH_LIFECYCLE_REGISTRY_CONFIG'])
          if directory.parent != Path(os.environ['RUNNER_TEMP']).resolve(strict=True):
              raise ValueError('Refusing a reader directory outside the job temporary root')
          directory.mkdir(mode=0o700)
          token = base64.b64encode((username + ':' + password).encode()).decode()
          descriptor = os.open(directory / 'config.json', os.O_WRONLY | os.O_CREAT | os.O_EXCL, 0o600)
          with os.fdopen(descriptor, 'w') as output:
              json.dump({'auths': {'registry.hexalith.com': {'auth': token}}}, output)
          PY
      - name: Exercise real passing failing partial-startup and exact retry scenarios
        if: ${{ inputs.scenario == 'matrix' }}
        env:
          DOCKER_CONFIG: ${{ runner.temp }}/hexalith-lifecycle-registry.reader
        run: python3 -B scripts/qualify-disposable-ci.py matrix
      - name: Exercise only the explicitly selected CI contract cases
        if: ${{ inputs.scenario == 'focused-ci' }}
        env:
          DOCKER_CONFIG: ${{ runner.temp }}/hexalith-lifecycle-registry.reader
        run: python3 -B scripts/qualify-disposable-ci.py focused-ci
      - name: Exercise one explicitly selected lifecycle case
        if: ${{ inputs.scenario != 'matrix' && inputs.scenario != 'focused-ci' && inputs.scenario != 'cancel-startup' && inputs.scenario != 'cancel-execution' && inputs.scenario != 'failure-then-cancellation' }}
        env:
          DOCKER_CONFIG: ${{ runner.temp }}/hexalith-lifecycle-registry.reader
          SELECTED_SCENARIO: ${{ inputs.scenario }}
        run: python3 -B scripts/qualify-disposable-ci.py "$SELECTED_SCENARIO"
      - name: Record a durable real failure before operator cancellation
        if: ${{ inputs.scenario == 'failure-then-cancellation' }}
        env:
          DOCKER_CONFIG: ${{ runner.temp }}/hexalith-lifecycle-registry.reader
        run: python3 -B scripts/qualify-disposable-ci.py start-cancellation --phase failure
      - name: Observe actual startup cancellation readiness
        if: ${{ inputs.scenario == 'cancel-startup' }}
        env:
          DOCKER_CONFIG: ${{ runner.temp }}/hexalith-lifecycle-registry.reader
        run: python3 -B scripts/qualify-disposable-ci.py start-cancellation --phase startup
      - name: Observe actual execution cancellation readiness and active hold
        if: ${{ inputs.scenario == 'cancel-execution' }}
        env:
          DOCKER_CONFIG: ${{ runner.temp }}/hexalith-lifecycle-registry.reader
        run: python3 -B scripts/qualify-disposable-ci.py start-cancellation --phase execution
      - name: Publish the actual ready owner before operator cancellation
        if: ${{ inputs.scenario == 'cancel-startup' || inputs.scenario == 'cancel-execution' || inputs.scenario == 'failure-then-cancellation' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: lifecycle-cancellation-ready
          path: TestResults/ci-lifecycle
          if-no-files-found: error
          retention-days: 14
      # The runner signals only this step's own process; exec keeps the controller as that process.
      - name: Await parent cancellation of this exact ready run
        if: ${{ inputs.scenario == 'cancel-startup' || inputs.scenario == 'cancel-execution' || inputs.scenario == 'failure-then-cancellation' }}
        run: exec python3 -B scripts/qualify-disposable-ci.py wait-cancellation
      - name: Independently finalize every exact same-job owner
        if: always()
        env:
          ACTUAL_JOB_STATUS: ${{ job.status }}
        run: |
          if [ -f "$RUNNER_TEMP/hexalith-ci-qualification/journal.json" ]; then
            python3 -B scripts/qualify-disposable-ci.py finalize --job-status "$ACTUAL_JOB_STATUS"
          fi
      - name: Remove the private reader file
        if: always()
        env:
          HEXALITH_LIFECYCLE_REGISTRY_CONFIG: ${{ runner.temp }}/hexalith-lifecycle-registry.reader
        run: python3 -B scripts/qualify-disposable-ci.py remove-reader
      - name: Retain classified lifecycle observations
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ci-lifecycle-observations
          path: TestResults/ci-lifecycle
          if-no-files-found: warn
          retention-days: 14
