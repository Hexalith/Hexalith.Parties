name: Parties 4.0.0 integration exception

on:
  push:
    branches: [main]

permissions:
  actions: read
  contents: read

jobs:
  verify:
    if: github.event.before == 'e68f6e52b98fc1c496950631dc060daed5b37558'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
          persist-credentials: false
      - name: Verify the authorized source and exact check results
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
          BASE: e68f6e52b98fc1c496950631dc060daed5b37558
        run: |
          set -euo pipefail
          [[ "$GITHUB_REPOSITORY" == Hexalith/Hexalith.Parties && "$GITHUB_REF" == refs/heads/main ]]
          [[ "$(git rev-list --parents -n 1 HEAD)" == "$GITHUB_SHA $BASE" ]]
          expected=$'.github/workflows/release-qualification.yml\n.github/workflows/release.yml\nscripts/validate-publication-preflight.sh'
          [[ "$(git diff --name-only "$BASE" HEAD)" == "$expected" ]]

          runs() {
            gh api -X GET "repos/$GITHUB_REPOSITORY/actions/workflows/$1/runs" \
              -f event=push -f branch=main -f head_sha="$GITHUB_SHA" -f per_page=30
          }
          run_id=
          for attempt in {1..70}; do
            run_id=$(runs ci.yml | jq -r '
              .workflow_runs
              | map(select(.path == ".github/workflows/ci.yml" and .status == "completed"))
              | first | .id // empty')
            if [[ "$run_id" =~ ^[1-9][0-9]*$ ]]; then break; fi
            sleep 30
          done
          [[ "$run_id" =~ ^[1-9][0-9]*$ ]]
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run_id" |
            jq -e --arg sha "$GITHUB_SHA" '
              .head_sha == $sha and .path == ".github/workflows/ci.yml"
              and .head_branch == "main" and .event == "push" and .run_attempt == 1
              and .status == "completed" and .conclusion == "failure"' >/dev/null

          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run_id/attempts/1/jobs?per_page=100" |
            jq -e '
              def failures: [.steps[] | select(.conclusion == "failure") | .name];
              .total_count == 11
              and (.jobs | length) == 11
              and ([.jobs[] | select(.conclusion == "success")] | length) == 9
              and ([.jobs[] | select(.conclusion == "failure" and .name == "ci / build-and-test"
                 and failures == ["Runner-owned package integration"]
                 and ([.steps[] | select(.conclusion == "success") | .name]
                   | contains(["Restore","Build","Validate package consumer references",
                               "Unit tests (Tier 1, Microsoft.Testing.Platform)","Finalize exact CI owner"])))] | length) == 1
              and ([.jobs[] | select(.conclusion == "failure" and .name == "verify-public-package-integration"
                 and failures == ["Require the owning integration job to pass"])] | length) == 1' >/dev/null

          for workflow in codeql.yml commitlint.yml rc-gate.yml; do
            runs "$workflow" | jq -e --arg sha "$GITHUB_SHA" '
              [.workflow_runs[] | select(.head_sha == $sha and .head_branch == "main"
                and .event == "push" and .status == "completed" and .conclusion == "success")]
              | length > 0' >/dev/null
          done
          echo "run-id=$run_id" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          github-token: ${{ github.token }}
          run-id: ${{ steps.source.outputs.run-id }}
          name: module-integration-diagnostics
          path: ${{ runner.temp }}/parties-integration
      - name: Require HXP020 before startup with verified cleanup
        env:
          CI_RUN: ${{ steps.source.outputs.run-id }}
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/parties-integration"
          jq -en --arg run "$CI_RUN" --slurpfile execution execution.json --slurpfile cleanup cleanup-2.json '
            def no_resources:
              . == {claimIds: [],containerIds: [],discoveryFailures: [],isEmpty: true,
                    processIds: [],resourceIds: [],unverified: false,workspaceIds: []};
            ($execution | length) == 1 and ($cleanup | length) == 1 and
            ($execution[0] as $e | $cleanup[0] as $c |
              $e.schema == "hexalith.module.ci-integration-execution.v1"
              and $e.executionContext.workflowRunId == $run and $e.executionContext.workflowAttempt == 1
              and $e.launched == true and $e.outputParsed == true and $e.cancelled == false
              and $e.timedOut == false and $e.signals == [] and $e.processExitCode == 3
              and $e.result.status == "failed" and $e.result.outcome == {
                category:"TopologyOrLifecycle",exitCode:"TopologyOrLifecycle",phase:"Topology",ruleId:"HXP020"}
              and ($e.result.diagnostics | length) == 1
              and $e.result.diagnostics[0].field == "platform"
              and $e.result.diagnostics[0].hint == "Supply the named owner input; no resources were started."
              and ($e.result.remainingResources | no_resources)
              and $c.schema == "hexalith.module.ci-integration-cleanup.v1"
              and $c.executionContext == $e.executionContext and $c.runId == $e.result.runId
              and $c.jobStatus == "failure" and $c.status == "completed"
              and $c.verified == true and $c.processExitCode == 0
              and $c.result.outcome.exitCode == "Success" and ($c.result.remainingResources | no_resources))' >/dev/null
          echo "::warning title=Parties 4.0.0 release exception::The administrator waived only the native Platform HXP020 startup failure in CI run $CI_RUN. Native integration did not pass."
          {
            echo '## Parties 4.0.0 release exception'
            echo "Source: `$GITHUB_SHA`"
            echo "CI run: https://github.com/$GITHUB_REPOSITORY/actions/runs/$CI_RUN"
            echo 'The administrator waived the native Platform HXP020 startup failure for this release. All other CI jobs passed and cleanup was verified.'
          } >> "$GITHUB_STEP_SUMMARY"
