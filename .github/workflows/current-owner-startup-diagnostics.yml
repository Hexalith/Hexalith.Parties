name: Current-owner startup diagnostics

on:
  workflow_dispatch:

permissions:
  contents: read

# Each dispatch owns a separate ordinary package invocation and mandatory cleanup.
concurrency:
  group: startup-diagnostic-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  observe:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: false
          fetch-depth: 0
          persist-credentials: false
      - name: Initialize only recorded root-direct dependencies
        uses: Hexalith/Hexalith.Builds/Github/initialize-build@3c2f5944aaa28dc7854a00a8a9df171aa810b0c7
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
          dotnet-version: '10.0.404'
      - name: Require the genuine diagnostic tool inputs
        shell: bash
        run: |
          test "$(git -C references/Hexalith.Builds rev-parse HEAD)" = 3c2f5944aaa28dc7854a00a8a9df171aa810b0c7
          python3 - <<'PYTHON'
          import json
          from pathlib import Path
          tool = json.loads(Path('.config/dotnet-tools.json').read_text())['tools']['hexalith.builds.module.cli']
          assert tool['version'] == '4.48.0' and tool['rollForward'] is False
          PYTHON
      - name: Test observer ownership and redaction boundaries
        run: python3 -B -m unittest discover -s tests/ci-lifecycle -p test_startup_observer.py -v
      - name: Prepare the ordinary verified package imports and local tool
        uses: Hexalith/Hexalith.Builds/Github/prepare-module-build@3c2f5944aaa28dc7854a00a8a9df171aa810b0c7
        with:
          manifest: module/hexalith.module-manifest.v2.json
      - name: Prepare ordinary package dependencies
        run: bash scripts/prepare-ci-package-dependencies.sh
      - name: Build the ordinary package solution
        run: dotnet build Hexalith.Parties.Standalone.slnx --configuration Release -m:1 -warnaserror
      - name: Install integration toolchain without starting services
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PYTHON'
          import json
          import os
          import re
          import xml.etree.ElementTree as ET
          from pathlib import Path
          builds = Path('references/Hexalith.Builds')
          root = ET.parse(builds / 'Props/Directory.Packages.props').getroot()
          versions = {}
          for key, element in [('CI_ASPIRE_VERSION', 'HexalithAspireAppHostSdkVersion'), ('CI_DAPR_CLI_VERSION', 'HexalithDaprCliVersion'), ('CI_DAPR_RUNTIME_VERSION', 'HexalithDaprRuntimeVersion')]:
              node = root.find('.//' + element)
              if node is None or node.text is None:
                  raise ValueError('Missing verified catalog toolchain property: ' + element)
              value = node.text.strip()
              if not value or any(c not in '0123456789.-abcdefghijklmnopqrstuvwxyz' for c in value):
                  raise ValueError('invalid workflow-owned toolchain version')
              versions[key] = value
          # Builds pins each Dapr archive digest beside the catalog versions; without them nothing is downloaded.
          digests_path = builds / 'Props/dapr-toolchain-sha256.json'
          if not digests_path.is_file():
              raise ValueError('The pinned Builds catalog carries no Dapr archive digests; adopt a Builds release that pins them')
          digests = json.loads(digests_path.read_text(encoding='utf-8'))
          if digests.get('schema') != 'hexalith.builds.dapr-toolchain-sha256.v1':
              raise ValueError('Unsupported Dapr archive digest schema')
          runtime = digests.get('runtime', {}).get(versions['CI_DAPR_RUNTIME_VERSION'], {})
          pinned = {
              'CI_DAPR_CLI_SHA256': digests.get('cli', {}).get(versions['CI_DAPR_CLI_VERSION'], {}).get('dapr_linux_amd64.tar.gz'),
              'CI_DAPRD_SHA256': runtime.get('daprd_linux_amd64.tar.gz'),
              'CI_PLACEMENT_SHA256': runtime.get('placement_linux_amd64.tar.gz'),
              'CI_SCHEDULER_SHA256': runtime.get('scheduler_linux_amd64.tar.gz'),
          }
          for key, value in pinned.items():
              if not isinstance(value, str) or re.fullmatch(r'[0-9a-f]{64}', value) is None:
                  raise ValueError('Missing or invalid pinned Dapr archive digest: ' + key)
          with Path(os.environ['GITHUB_ENV']).open('a') as stream:
              for key, value in {**versions, **pinned}.items():
                  stream.write(key + '=' + value + '\n')
          PYTHON
      - name: Prepare integration binaries
        shell: bash
        run: |
          set -euo pipefail
          tools="$RUNNER_TEMP/hexalith-ci-tools"
          dapr_home="$RUNNER_TEMP/hexalith-ci-dapr"
          mkdir -p "$tools" "$dapr_home/tools" "$dapr_home/.dapr/bin"
          dotnet tool install --tool-path "$tools" Aspire.Cli --version "$CI_ASPIRE_VERSION"
          verify_archive() {
            if [[ ! "$1" =~ ^[0-9a-f]{64}$ ]]; then
              echo "Refusing $2 without its pinned SHA-256 digest." >&2
              return 1
            fi
            printf '%s  %s\n' "$1" "$2" | sha256sum --check --strict --quiet -
          }
          curl --fail --location --proto '=https' --proto-redir '=https' --retry 3 "https://github.com/dapr/cli/releases/download/v$CI_DAPR_CLI_VERSION/dapr_linux_amd64.tar.gz" -o "$RUNNER_TEMP/dapr-cli.tar.gz"
          verify_archive "${CI_DAPR_CLI_SHA256:-}" "$RUNNER_TEMP/dapr-cli.tar.gz"
          tar -xzf "$RUNNER_TEMP/dapr-cli.tar.gz" -C "$dapr_home/tools" dapr
          for binary in daprd placement scheduler; do
            case "$binary" in
              daprd) digest="${CI_DAPRD_SHA256:-}" ;;
              placement) digest="${CI_PLACEMENT_SHA256:-}" ;;
              scheduler) digest="${CI_SCHEDULER_SHA256:-}" ;;
            esac
            curl --fail --location --proto '=https' --proto-redir '=https' --retry 3 "https://github.com/dapr/dapr/releases/download/v$CI_DAPR_RUNTIME_VERSION/${binary}_linux_amd64.tar.gz" -o "$RUNNER_TEMP/$binary.tar.gz"
            verify_archive "$digest" "$RUNNER_TEMP/$binary.tar.gz"
            tar -xzf "$RUNNER_TEMP/$binary.tar.gz" -C "$dapr_home/.dapr/bin" "$binary"
          done
          echo "$tools" >> "$GITHUB_PATH"
          echo "HEXALITH_DAPR_HOME=$dapr_home" >> "$GITHUB_ENV"
      # The reader file lives at a fixed path under runner.temp, so any later step in this job could read it.
      # Only the observer step receives it as DOCKER_CONFIG, nothing exports it through GITHUB_ENV, and an
      # always() step removes it.
      - name: Configure only the dedicated pull reader
        env:
          REGISTRY_READER_USERNAME: ${{ secrets.HEXALITH_CI_REGISTRY_USERNAME }}
          REGISTRY_READER_PASSWORD: ${{ secrets.HEXALITH_CI_REGISTRY_PASSWORD }}
          HEXALITH_LIFECYCLE_REGISTRY_CONFIG: ${{ runner.temp }}/hexalith-lifecycle-registry.startup-reader
        run: |
          python3 - <<'PY'
          import base64
          import json
          import os
          from pathlib import Path
          username, password = (os.environ[key] for key in ['REGISTRY_READER_USERNAME', 'REGISTRY_READER_PASSWORD'])
          if not username or not password:
              raise ValueError('Dedicated pull-only reader is required')
          directory = Path(os.environ['HEXALITH_LIFECYCLE_REGISTRY_CONFIG'])
          if directory.parent != Path(os.environ['RUNNER_TEMP']).resolve(strict=True):
              raise ValueError('Refusing a reader directory outside the job temporary root')
          directory.mkdir(mode=0o700)
          token = base64.b64encode((username + ':' + password).encode()).decode()
          descriptor = os.open(directory / 'config.json', os.O_WRONLY | os.O_CREAT | os.O_EXCL, 0o600)
          with os.fdopen(descriptor, 'w') as output:
              json.dump({'auths': {'registry.hexalith.com': {'auth': token}}}, output)
          PY
      - name: Observe the actual current-owner startup before standard cleanup
        timeout-minutes: 25
        env:
          DOCKER_CONFIG: ${{ runner.temp }}/hexalith-lifecycle-registry.startup-reader
        # The runner signals only this step's process; exec keeps the observer, and its helper, as that process.
        run: exec python3 -B scripts/observe-current-owner-startup.py
      - name: Independently finalize the exact issued owner
        if: always()
        timeout-minutes: 4
        env:
          CI_JOB_STATUS: ${{ job.status }}
        run: >-
          python3 references/Hexalith.Builds/Github/run-module-integration/run_module_integration.py
          finalize --receipt "$RUNNER_TEMP/hexalith-ci-owner.json"
          --evidence TestResults/module-integration --job-status "$CI_JOB_STATUS"
      - name: Remove the private reader file
        if: always()
        env:
          HEXALITH_LIFECYCLE_REGISTRY_CONFIG: ${{ runner.temp }}/hexalith-lifecycle-registry.startup-reader
        run: python3 -B scripts/qualify-disposable-ci.py remove-reader
      - name: Retain only bounded redacted startup and helper outcome metadata
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: current-owner-startup-observation
          path: TestResults/startup-observer/startup-observation.json
          if-no-files-found: warn
          retention-days: 7
