name: Release Candidate Gate

# Root gitlink RC gate: every root submodule pointer bumped into a release
# candidate must be owner-validated in .gitlink-signoff.tsv (or reset). See
# RELEASE-CHECKLIST.md and scripts/gitlink-rc-gate.sh.

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, labeled]
  push:
    branches:
      - main
      - 'rc/**'
      - 'release/**'
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      base_ref:
        description: Base ref to diff root gitlinks against
        default: origin/main
        required: false

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}-${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && github.sha || 'latest' }}
  cancel-in-progress: true

jobs:
  gitlink-rc-gate:
    name: Root gitlink RC gate
    # On pull requests, only enforce when the PR is labelled a release candidate.
    if: >-
      github.event_name != 'pull_request' ||
      contains(github.event.pull_request.labels.*.name, 'release-candidate')
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          # Full history so the base ref resolves; submodule contents are not
          # needed (the gate reads gitlink SHAs from the tree via git ls-tree).
          fetch-depth: 0
          submodules: false

      - name: Determine base ref
        id: base
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_REF: ${{ github.ref }}
          EVENT_BEFORE: ${{ github.event.before }}
          BASE_REF: ${{ github.base_ref }}
          MANUAL_BASE: ${{ github.event.inputs.base_ref || '' }}
        run: |
          set -euo pipefail
          mode=diff
          if [ "$EVENT_NAME" = push ] && [ "$EVENT_REF" = refs/heads/main ]; then
            base="$EVENT_BEFORE"
            if [[ ! "$base" =~ ^[0-9a-f]{40}$ ]] || [[ "$base" =~ ^0+$ ]] ||
               ! git cat-file -e "${base}^{commit}" || ! git merge-base --is-ancestor "$base" HEAD; then
              echo "Main push requires a usable ancestor event.before commit." >&2
              exit 1
            fi
            mode=push-range
          elif [ "$EVENT_NAME" = pull_request ]; then
            base="origin/$BASE_REF"
          elif [ -n "$MANUAL_BASE" ]; then
            base="$MANUAL_BASE"
          else
            base="$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo origin/main)"
          fi
          echo "ref=$base" >> "$GITHUB_OUTPUT"
          echo "mode=$mode" >> "$GITHUB_OUTPUT"
          echo "Checking root gitlinks against: $base ($mode)"

      - name: Root gitlink RC gate
        shell: bash
        env:
          GATE_BASE: ${{ steps.base.outputs.ref }}
          GATE_MODE: ${{ steps.base.outputs.mode }}
        run: bash scripts/gitlink-rc-gate.sh "--$GATE_MODE" "$GATE_BASE"
